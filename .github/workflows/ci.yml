name: Cabsplit CI pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application
        run: mvn clean package

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # Build and Push Docker Image to ECR
      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: cabsplit
          IMAGE_TAG: v${{ github.run_number }}

        run: |

          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

          docker tag \
          $ECR_REPOSITORY:$IMAGE_TAG \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Kubernetes Image Tag
      
        run: |
          sed -i "s|cabsplit:v.*|cabsplit:v${{ github.run_number }}|g" k8s/deployment.yaml

          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git add k8s/deployment.yaml
          git commit -m "Update image tag to v${{ github.run_number }}"
          git push
